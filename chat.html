<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мессенджер</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #075e54;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            color: black;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            width: 90%;
            font-size: 16px;
        }
        button {
            background: #075e54;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .error {
            color: red;
            margin: 10px;
        }
        .success {
            color: green;
            margin: 10px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: #ddd;
            cursor: pointer;
            border-radius: 5px;
            margin: 0 5px;
        }
        .tab.active {
            background: #075e54;
            color: white;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        #chat {
            display: none;
        }
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            background: #e5ddd5;
            text-align: left;
        }
        .message {
            margin: 5px;
            padding: 8px;
            border-radius: 8px;
        }
        .in {
            background: white;
        }
        .out {
            background: #dcf8c6;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Мессенджер</h1>
        
        <div id="auth">
            <div class="tabs">
                <div class="tab active" onclick="showTab('login')">Вход</div>
                <div class="tab" onclick="showTab('register')">Регистрация</div>
            </div>
            
            <div id="login-form" class="auth-form active">
                <input type="text" id="login-username" placeholder="Имя пользователя">
                <input type="password" id="login-password" placeholder="Пароль">
                <button onclick="doLogin()">Войти</button>
                <div id="login-error" class="error"></div>
            </div>
            
            <div id="register-form" class="auth-form">
                <input type="text" id="reg-username" placeholder="Имя пользователя">
                <input type="password" id="reg-password" placeholder="Пароль">
                <input type="password" id="reg-password2" placeholder="Повторите пароль">
                <button onclick="doRegister()">Зарегистрироваться</button>
                <div id="reg-error" class="error"></div>
                <div id="reg-success" class="success"></div>
            </div>
        </div>
        
        <div id="chat">
            <div>
                <span>Вы: <b id="my-name"></b></span>
                <button onclick="logout()">Выход</button>
            </div>
            <div id="messages"></div>
            <input type="text" id="msg" placeholder="Сообщение...">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        var ws = null;
        var myName = '';
        
        function showTab(tab) {
            var loginForm = document.getElementById('login-form');
            var registerForm = document.getElementById('register-form');
            var tabs = document.querySelectorAll('.tab');
            if (tab === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
            }
            document.getElementById('login-error').textContent = '';
            document.getElementById('reg-error').textContent = '';
            document.getElementById('reg-success').textContent = '';
        }
        
        function doRegister() {
            var username = document.getElementById('reg-username').value.trim();
            var password = document.getElementById('reg-password').value;
            var password2 = document.getElementById('reg-password2').value;
            
            if (!username || !password) {
                document.getElementById('reg-error').textContent = 'Заполните все поля';
                return;
            }
            if (password !== password2) {
                document.getElementById('reg-error').textContent = 'Пароли не совпадают';
                return;
            }
            if (password.length < 4) {
                document.getElementById('reg-error').textContent = 'Пароль минимум 4 символа';
                return;
            }
            
            document.getElementById('reg-error').textContent = '';
            document.getElementById('reg-success').textContent = 'Регистрация...';
            
            var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
            var tempWs = new WebSocket(url);
            
            tempWs.onopen = function() {
                tempWs.send(JSON.stringify({ type: 'register', from: username, password: password }));
            };
            
            tempWs.onmessage = function(e) {
                var m = JSON.parse(e.data);
                if (m.type === 'register_result') {
                    if (m.success) {
                        document.getElementById('reg-success').textContent = 'Регистрация успешна! Теперь войдите.';
                        setTimeout(function() {
                            showTab('login');
                            document.getElementById('login-username').value = username;
                            tempWs.close();
                        }, 1500);
                    } else {
                        document.getElementById('reg-error').textContent = m.error || 'Ошибка регистрации';
                        document.getElementById('reg-success').textContent = '';
                    }
                }
            };
            
            tempWs.onerror = function() {
                document.getElementById('reg-error').textContent = 'Ошибка подключения к серверу';
            };
        }
        
        function doLogin() {
            var username = document.getElementById('login-username').value.trim();
            var password = document.getElementById('login-password').value;
            
            if (!username || !password) {
                document.getElementById('login-error').textContent = 'Введите имя и пароль';
                return;
            }
            
            myName = username;
            var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
            ws = new WebSocket(url);
            
            ws.onopen = function() {
                ws.send(JSON.stringify({ type: 'login', from: username, password: password }));
            };
            
            ws.onmessage = function(e) {
                var m = JSON.parse(e.data);
                console.log("Ответ сервера:", m);
                
                if (m.type === 'login_result') {
                    if (m.success) {
                        document.getElementById('auth').style.display = 'none';
                        document.getElementById('chat').style.display = 'block';
                        document.getElementById('my-name').textContent = myName;
                    } else {
                        document.getElementById('login-error').textContent = m.error || 'Ошибка входа';
                        myName = '';
                    }
                }
            };
            
            ws.onerror = function() {
                document.getElementById('login-error').textContent = 'Не удалось подключиться к серверу';
            };
        }
        
        function sendMessage() {
            var text = document.getElementById('msg').value.trim();
            if (!text) return;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'message', to: 'test', text: text }));
                document.getElementById('msg').value = '';
            }
        }
        
        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
