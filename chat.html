<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мессенджер</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#075e54">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Мессенджер">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: #f0f0f0;
        }

        #auth {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #auth-box {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        #auth-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #075e54;
            text-align: center;
            font-size: 28px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab.active {
            color: #075e54;
            border-bottom: 2px solid #075e54;
            margin-bottom: -2px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            background: #f5f5f5;
        }

        input:focus {
            outline: none;
            border-color: #075e54;
            background: white;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #075e54;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #054a42;
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .success {
            color: #27ae60;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        #sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            display: none;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            display: none;
            background: #e5ddd5;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 5px 0;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 75%;
            word-wrap: break-word;
            position: relative;
        }

        .message img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 5px;
        }

        .message .sticker {
            font-size: 48px;
            cursor: pointer;
            display: inline-block;
        }

        .message .message-name {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #075e54;
        }

        .in {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .out {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
            text-align: right;
        }

        #input {
            padding: 12px;
            background: #f0f0f0;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #e0e0e0;
        }

        #input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
            background: white;
        }

        .contact {
            padding: 14px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .contact:hover {
            background: #f5f5f5;
        }

        .contact-name {
            flex: 1;
            font-weight: 500;
        }

        .contact-actions {
            display: none;
            gap: 8px;
        }

        .contact:hover .contact-actions {
            display: flex;
        }

        .contact-actions button {
            padding: 4px 8px;
            font-size: 11px;
            background: #e74c3c;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }

        .contact-actions button.add-btn {
            background: #27ae60;
        }

        button {
            padding: 10px 18px;
            background: #075e54;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #054a42;
        }

        .contact-section {
            margin-top: 5px;
        }

        .section-title {
            padding: 10px 16px;
            background: #f5f5f5;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            letter-spacing: 0.5px;
        }

        .search-box {
            padding: 12px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            box-sizing: border-box;
            font-size: 14px;
            background: #f5f5f5;
        }

        .search-results {
            max-height: 250px;
            overflow-y: auto;
            background: white;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-result-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-result-item:hover {
            background: #f5f5f5;
        }

        .search-result-item button {
            padding: 6px 12px;
            font-size: 12px;
            background: #27ae60;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .top-bar {
            padding: 12px 16px;
            background: #075e54;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .top-bar button {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            font-size: 13px;
        }

        .top-bar button:hover {
            background: rgba(255,255,255,0.3);
        }

        .add-contact-panel {
            padding: 12px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
        }

        .add-contact-panel input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }

        .add-contact-panel button {
            padding: 10px 16px;
            background: #27ae60;
            font-size: 13px;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 2000;
            animation: fadeOut 3s forwards;
            font-size: 14px;
            white-space: nowrap;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        .input-buttons {
            display: flex;
            gap: 5px;
        }

        .input-buttons button {
            font-size: 18px;
            padding: 8px 14px;
            background: #075e54;
        }

        .sticker-panel {
            position: absolute;
            bottom: 80px;
            left: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .sticker-panel span {
            font-size: 36px;
            cursor: pointer;
            padding: 8px;
            text-align: center;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .sticker-panel span:hover {
            background: #f0f0f0;
        }

        #header {
            padding: 16px 20px;
            background: #075e54;
            color: white;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .group-buttons {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .group-buttons button {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            #sidebar {
                width: 100%;
                position: absolute;
                left: -100%;
                transition: left 0.3s;
                z-index: 100;
                height: 100%;
            }
            #sidebar.open {
                left: 0;
            }
            .message {
                max-width: 85%;
            }
            .toast {
                white-space: normal;
                text-align: center;
                max-width: 80%;
            }
            .menu-btn {
                display: block;
                background: none;
                font-size: 24px;
                padding: 0 10px;
                margin-right: 10px;
            }
            .group-buttons button {
                padding: 4px 8px;
                font-size: 11px;
            }
        }

        .menu-btn {
            display: none;
            background: none;
            font-size: 24px;
            padding: 0;
            margin-right: 10px;
            width: 40px;
        }

        .menu-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

<div id="auth">
    <div id="auth-box">
        <h2>💬 Мессенджер</h2>
        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">Вход</div>
            <div class="tab" onclick="showTab('register')">Регистрация</div>
        </div>
        <div id="login-form" class="auth-form active">
            <input type="text" id="login-username" placeholder="Имя пользователя">
            <input type="password" id="login-password" placeholder="Пароль">
            <button class="btn" onclick="doLogin()">Войти</button>
            <div id="login-error" class="error"></div>
        </div>
        <div id="register-form" class="auth-form">
            <input type="text" id="reg-username" placeholder="Придумайте имя">
            <input type="password" id="reg-password" placeholder="Придумайте пароль">
            <input type="password" id="reg-password2" placeholder="Повторите пароль">
            <button class="btn" onclick="doRegister()">Зарегистрироваться</button>
            <div id="reg-error" class="error"></div>
            <div id="reg-success" class="success"></div>
        </div>
    </div>
</div>

<div id="sidebar">
    <div style="padding: 16px 20px; background: #075e54; color: white; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 20px; font-weight: 600;">💬 Чаты</span>
        <button onclick="showCreateGroup()" style="background: rgba(255,255,255,0.2);">+ Группа</button>
    </div>
    <div class="top-bar">
        <span>Вы: <b id="my-name"></b></span>
        <div>
            <button onclick="getAllUsers()" style="margin-right: 5px;">👥</button>
            <button onclick="logout()">Выход</button>
        </div>
    </div>
    <div class="add-contact-panel">
        <input type="text" id="new-contact-name" placeholder="Имя для добавления">
        <button onclick="addContact()">➕ Добавить</button>
    </div>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 Поиск пользователей..." onkeyup="searchUsers()">
    </div>
    <div id="search-results" class="search-results" style="display: none;"></div>
    <div id="contacts"></div>
</div>

<div id="chat">
    <div id="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <span style="flex:1;">Выберите чат</span>
    </div>
    <div id="messages"></div>
    <div id="input" style="display: none">
        <input type="text" id="msg" placeholder="Сообщение...">
        <div class="input-buttons">
            <button onclick="openStickerPanel()">😊</button>
            <button onclick="sendPhoto()">📷</button>
            <button onclick="sendMessage()">📤</button>
        </div>
    </div>
</div>

<div id="sticker-panel" class="sticker-panel">
    <span onclick="sendSticker('😀')">😀</span>
    <span onclick="sendSticker('😂')">😂</span>
    <span onclick="sendSticker('🥰')">🥰</span>
    <span onclick="sendSticker('😍')">😍</span>
    <span onclick="sendSticker('🎉')">🎉</span>
    <span onclick="sendSticker('👍')">👍</span>
    <span onclick="sendSticker('🔥')">🔥</span>
    <span onclick="sendSticker('💯')">💯</span>
    <span onclick="sendSticker('❤️')">❤️</span>
    <span onclick="sendSticker('😢')">😢</span>
    <span onclick="sendSticker('😱')">😱</span>
    <span onclick="sendSticker('🤔')">🤔</span>
    <span onclick="sendSticker('😎')">😎</span>
    <span onclick="sendSticker('🥳')">🥳</span>
    <span onclick="sendSticker('💔')">💔</span>
    <span onclick="sendSticker('✨')">✨</span>
    <span onclick="sendSticker('⭐')">⭐</span>
    <span onclick="sendSticker('🍕')">🍕</span>
</div>

<script>
    var ws, myName = '', currentChat = '', isGroup = false, savedContacts = [], currentGroupCreator = '';
    
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }
    
    function showToast(message, isError) {
        var toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#e74c3c' : '#27ae60';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { if(toast && toast.remove) toast.remove(); }, 3000);
    }
    
    function openStickerPanel() {
        var panel = document.getElementById('sticker-panel');
        if (panel.style.display === 'grid') {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'grid';
        }
    }
    
    function sendSticker(sticker) {
        if (!currentChat) {
            showToast('Выберите чат', true);
            return;
        }
        ws.send(JSON.stringify({
            type: 'message',
            to: currentChat,
            sticker: sticker,
            text: ''
        }));
        document.getElementById('sticker-panel').style.display = 'none';
    }
    
    function sendPhoto() {
        if (!currentChat) {
            showToast('Выберите чат', true);
            return;
        }
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    ws.send(JSON.stringify({
                        type: 'message',
                        to: currentChat,
                        imageData: evt.target.result,
                        text: ''
                    }));
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }
    
    function sendMessage() {
        var text = document.getElementById('msg').value.trim();
        if (!text && !currentChat) return;
        if (!currentChat) {
            showToast('Выберите чат', true);
            return;
        }
        if (text) {
            ws.send(JSON.stringify({
                type: 'message',
                to: currentChat,
                text: text,
                imageData: '',
                sticker: ''
            }));
            document.getElementById('msg').value = '';
        }
    }
    
    function showTab(tab) {
        var tabs = document.querySelectorAll('.tab');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        var forms = document.querySelectorAll('.auth-form');
        forms.forEach(function(f) { f.classList.remove('active'); });
        if (tab === 'login') {
            if (tabs[0]) tabs[0].classList.add('active');
            document.getElementById('login-form').classList.add('active');
        } else {
            if (tabs[1]) tabs[1].classList.add('active');
            document.getElementById('register-form').classList.add('active');
        }
        document.getElementById('login-error').textContent = '';
        document.getElementById('reg-error').textContent = '';
        document.getElementById('reg-success').textContent = '';
    }
    
    function doRegister() {
        var username = document.getElementById('reg-username').value.trim();
        var password = document.getElementById('reg-password').value;
        var password2 = document.getElementById('reg-password2').value;
        if (!username || !password) {
            document.getElementById('reg-error').textContent = 'Заполните все поля';
            return;
        }
        if (password !== password2) {
            document.getElementById('reg-error').textContent = 'Пароли не совпадают';
            return;
        }
        if (password.length < 4) {
            document.getElementById('reg-error').textContent = 'Пароль минимум 4 символа';
            return;
        }
        document.getElementById('reg-error').textContent = '';
        document.getElementById('reg-success').textContent = 'Регистрация...';
        var wsUrl = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws";
        var tempWs = new WebSocket(wsUrl);
        tempWs.onopen = function() {
            tempWs.send(JSON.stringify({ type: 'register', from: username, password: password }));
        };
        tempWs.onmessage = function(e) {
            var msg = JSON.parse(e.data);
            if (msg.type === 'register_result') {
                if (msg.success) {
                    document.getElementById('reg-success').textContent = 'Регистрация успешна! Переключаюсь на вход...';
                    setTimeout(function() {
                        showTab('login');
                        document.getElementById('login-username').value = username;
                        tempWs.close();
                    }, 1500);
                } else {
                    document.getElementById('reg-error').textContent = msg.error || 'Ошибка регистрации';
                    document.getElementById('reg-success').textContent = '';
                }
            }
        };
        tempWs.onerror = function() {
            document.getElementById('reg-error').textContent = 'Ошибка подключения к серверу';
            document.getElementById('reg-success').textContent = '';
        };
    }
    
    function doLogin() {
        var username = document.getElementById('login-username').value.trim();
        var password = document.getElementById('login-password').value;
        if (!username || !password) {
            document.getElementById('login-error').textContent = 'Введите имя и пароль';
            return;
        }
        myName = username;
        var wsUrl = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws";
        ws = new WebSocket(wsUrl);
        ws.onopen = function() {
            ws.send(JSON.stringify({ type: 'login', from: username, password: password }));
        };
        ws.onmessage = function(e) {
            var msg = JSON.parse(e.data);
            if (msg.type === 'login_result') {
                if (msg.success) {
                    document.getElementById('auth').style.display = 'none';
                    document.getElementById('sidebar').style.display = 'flex';
                    document.getElementById('chat').style.display = 'flex';
                    document.getElementById('my-name').textContent = myName;
                    handleChatMessage(msg);
                } else {
                    document.getElementById('login-error').textContent = msg.error || 'Ошибка входа';
                    myName = '';
                }
            } else {
                handleChatMessage(msg);
            }
        };
        ws.onerror = function() {
            document.getElementById('login-error').textContent = 'Не удалось подключиться к серверу';
        };
    }
    
    function handleChatMessage(msg) {
        console.log("Получено:", msg.type, msg);
        
        if (msg.type === 'online') {
            updateOnlineUsers(msg.text ? msg.text.split(',') : []);
        } else if (msg.type === 'group_list') {
            updateGroups(msg.text);
        } else if (msg.type === 'contact_list') {
            savedContacts = msg.text ? msg.text.split(',') : [];
            renderContacts();
        } else if (msg.type === 'search_results') {
            showSearchResults(msg.text ? msg.text.split(',') : []);
        } else if (msg.type === 'user_list') {
            var users = msg.text ? msg.text.split(',') : [];
            alert("Зарегистрированные пользователи:\n" + (users.length ? users.join("\n") : "Нет других пользователей"));
        } else if (msg.type === 'add_contact_result') {
            if (msg.success) {
                showToast(msg.text || 'Контакт добавлен');
                document.getElementById('new-contact-name').value = '';
            } else {
                showToast(msg.error || 'Ошибка добавления контакта', true);
            }
        } else if (msg.type === 'delete_contact_result') {
            showToast(msg.text || 'Контакт удалён');
        } else if (msg.type === 'group_action_result') {
            if (msg.success) {
                showToast(msg.text || 'Готово');
            } else {
                showToast(msg.error || 'Ошибка', true);
            }
        } else if (msg.type === 'history') {
            showMessage(msg.from, msg.text, msg.imageData, msg.sticker, false);
        } else if (msg.type === 'message') {
            showMessage(msg.from, msg.text, msg.imageData, msg.sticker, msg.from === myName);
        } else if (msg.type === 'member_list') {
            currentGroupCreator = msg.GroupName || '';
            var memberCount = msg.text ? msg.text.split(',').length : 0;
            var groupName = currentChatName || 'Группа';
            var buttons = '';
            if (currentGroupCreator === myName) {
                buttons = '<div class="group-buttons"><button onclick="addMemberToGroup()">+</button><button onclick="removeMemberFromGroup()">-</button></div>';
            }
            document.getElementById('header').innerHTML = '<button class="menu-btn" onclick="toggleSidebar()">☰</button><span style="flex:1;">👥 ' + groupName + ' (' + memberCount + ')</span>' + buttons;
        }
    }
    
    function showMessage(from, text, imageData, sticker, isMe) {
        var messagesDiv = document.getElementById('messages');
        if (!messagesDiv) return;
        var div = document.createElement('div');
        div.className = 'message ' + (isMe ? 'out' : 'in');
        var content = '';
        if (!isMe) {
            content += '<div class="message-name">' + from + '</div>';
        }
        if (sticker) content += '<span class="sticker">' + sticker + '</span>';
        if (imageData) content += '<img src="' + imageData + '" onclick="window.open(this.src)">';
        if (text) content += text;
        content += '<div class="message-time">' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '</div>';
        div.innerHTML = content;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    
    function renderContacts() {
        var contactsDiv = document.getElementById('contacts');
        if (!contactsDiv) return;
        var html = '<div class="contact-section"><div class="section-title">💬 СОХРАНЁННЫЕ КОНТАКТЫ</div>';
        savedContacts.forEach(function(contact) {
            if (contact !== myName) {
                html += '<div class="contact" onclick="selectUser(\'' + contact + '\')">' +
                    '<span class="contact-name">📱 ' + contact + '</span>' +
                    '<div class="contact-actions">' +
                    '<button class="add-btn" onclick="event.stopPropagation(); addExistingContact(\'' + contact + '\')">➕</button>' +
                    '<button onclick="event.stopPropagation(); deleteContact(\'' + contact + '\')">🗑️</button>' +
                    '</div></div>';
            }
        });
        if (savedContacts.length === 0 || (savedContacts.length === 1 && savedContacts[0] === myName)) {
            html += '<div style="padding: 20px; text-align: center; color: #999;">Нет сохранённых контактов</div>';
        }
        html += '</div><div class="contact-section"><div class="section-title">🟢 ОНЛАЙН</div><div id="online-users"></div></div>';
        contactsDiv.innerHTML = html;
    }
    
    function updateOnlineUsers(users) {
        var onlineDiv = document.getElementById('online-users');
        if (!onlineDiv) return;
        var html = '';
        users.forEach(function(user) {
            if (user !== myName) {
                var isSaved = savedContacts.includes(user);
                var icon = isSaved ? '📱' : '🟢';
                html += '<div class="contact" onclick="selectUser(\'' + user + '\')">' +
                    '<span class="contact-name">' + icon + ' ' + user + '</span>' +
                    '<div class="contact-actions">' +
                    '<button class="add-btn" onclick="event.stopPropagation(); addExistingContact(\'' + user + '\')">➕</button>' +
                    '</div></div>';
            }
        });
        if (html === '') html = '<div style="padding: 20px; text-align: center; color: #999;">Никого нет в сети</div>';
        onlineDiv.innerHTML = html;
    }
    
    function updateGroups(groups) {
        if (!groups || groups === '') return;
        var html = '<div class="contact-section"><div class="section-title">👥 ГРУППЫ</div>';
        groups.split(',').forEach(function(g) {
            var parts = g.split('|');
            if (parts.length === 2) {
                html += '<div class="contact" onclick="selectGroup(\'' + parts[0] + '\',\'' + parts[1] + '\')">' +
                    '<span class="contact-name">👥 ' + parts[1] + '</span></div>';
            }
        });
        html += '</div>';
        var contactsDiv = document.getElementById('contacts');
        if (contactsDiv) contactsDiv.innerHTML = html + contactsDiv.innerHTML;
    }
    
    function searchUsers() {
        var query = document.getElementById('search-input').value.trim();
        var resultsDiv = document.getElementById('search-results');
        if (query === '') {
            resultsDiv.style.display = 'none';
            resultsDiv.innerHTML = '';
            return;
        }
        resultsDiv.innerHTML = '<div class="no-results">🔍 Поиск...</div>';
        resultsDiv.style.display = 'block';
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'search_users', text: query }));
        }
    }
    
    function showSearchResults(users) {
        var resultsDiv = document.getElementById('search-results');
        if (!resultsDiv) return;
        if (!users || users.length === 0) {
            resultsDiv.innerHTML = '<div class="no-results">👤 Пользователи не найдены</div>';
            return;
        }
        var html = '';
        users.forEach(function(user) {
            if (user !== myName) {
                var isSaved = savedContacts.includes(user);
                var icon = isSaved ? '📱' : '👤';
                html += '<div class="search-result-item">' +
                    '<span>' + icon + ' ' + user + '</span>' +
                    '<button onclick="addContactByName(\'' + user + '\'); clearSearch();">➕ Добавить</button>' +
                    '</div>';
            }
        });
        resultsDiv.innerHTML = html || '<div class="no-results">👤 Пользователи не найдены</div>';
    }
    
    function addContactByName(username) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'add_contact', text: username }));
        }
    }
    
    function addContact() {
        var name = document.getElementById('new-contact-name').value.trim();
        if (!name) { showToast('Введите имя пользователя', true); return; }
        if (name === myName) { showToast('Нельзя добавить самого себя', true); return; }
        addContactByName(name);
    }
    
    function addExistingContact(name) { addContactByName(name); }
    
    function deleteContact(name) {
        if (confirm('Удалить контакт ' + name + '?')) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'delete_contact', text: name }));
            }
        }
    }
    
    function getAllUsers() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'get_users' }));
        } else { alert("Нет соединения с сервером"); }
    }
    
    function clearSearch() {
        document.getElementById('search-input').value = '';
        document.getElementById('search-results').style.display = 'none';
        document.getElementById('search-results').innerHTML = '';
    }
    
    function addMemberToGroup() {
        if (!currentChat || !isGroup) {
            showToast('Выберите группу', true);
            return;
        }
        var username = prompt('Введите имя пользователя для добавления в группу:');
        if (username && username.trim() && username.trim() !== myName) {
            ws.send(JSON.stringify({
                type: 'add_group_member',
                to: currentChat,
                text: username.trim()
            }));
        } else if (username === myName) {
            showToast('Нельзя добавить самого себя', true);
        }
    }
    
    function removeMemberFromGroup() {
        if (!currentChat || !isGroup) {
            showToast('Выберите группу', true);
            return;
        }
        var username = prompt('Введите имя пользователя для удаления из группы:');
        if (username && username.trim()) {
            ws.send(JSON.stringify({
                type: 'remove_group_member',
                to: currentChat,
                text: username.trim()
            }));
        }
    }
    
    var currentChatName = '';
    
    function selectUser(name) {
        currentChat = name;
        isGroup = false;
        currentChatName = name;
        document.getElementById('header').innerHTML = '<button class="menu-btn" onclick="toggleSidebar()">☰</button><span style="flex:1;">💬 ' + name + '</span>';
        document.getElementById('messages').innerHTML = '';
        document.getElementById('input').style.display = 'flex';
        ws.send(JSON.stringify({ type: 'select_dialog', to: name }));
        clearSearch();
        if (window.innerWidth <= 768) toggleSidebar();
    }
    
    function selectGroup(id, name) {
        currentChat = id;
        isGroup = true;
        currentChatName = name;
        document.getElementById('header').innerHTML = '<button class="menu-btn" onclick="toggleSidebar()">☰</button><span style="flex:1;">👥 ' + name + '</span>';
        document.getElementById('messages').innerHTML = '';
        document.getElementById('input').style.display = 'flex';
        ws.send(JSON.stringify({ type: 'select_group', to: id }));
        clearSearch();
        if (window.innerWidth <= 768) toggleSidebar();
    }
    
    function showCreateGroup() {
        var name = prompt('Название группы:');
        if (!name) return;
        var members = prompt('Участники (через запятую):');
        ws.send(JSON.stringify({ type: 'create_group', groupName: name, members: myName + ',' + members }));
    }
    
    function logout() { location.reload(); }
    
    document.getElementById('msg').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });
    
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Service Worker зарегистрирован', reg);
        }).catch(function(err) {
            console.log('Ошибка регистрации Service Worker', err);
        });
    }
    
    console.log("Скрипт загружен, группы: добавление/удаление участников");
</script>

</body>
</html>
