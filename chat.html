<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: #075e54; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        input, button { padding: 10px; margin: 5px; width: 90%; }
        .error { color: red; }
        .success { color: green; }
        #chat { display: none; }
        #sidebar { display: none; }
        .contact { padding: 5px; cursor: pointer; background: #eee; margin: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div id="auth">
        <h2>💬 Мессенджер</h2>
        <input type="text" id="login-username" placeholder="Имя (3-20, буквы, цифры, пробелы, _)"><br>
        <input type="password" id="login-password" placeholder="Пароль"><br>
        <button onclick="doLogin()">Войти</button>
        <div id="login-error" class="error"></div>
        <hr>
        <h3>Регистрация</h3>
        <input type="text" id="reg-username" placeholder="Имя"><br>
        <input type="password" id="reg-password" placeholder="Пароль"><br>
        <input type="password" id="reg-password2" placeholder="Повторите"><br>
        <button onclick="doRegister()">Зарегистрироваться</button>
        <div id="reg-error" class="error"></div>
        <div id="reg-success" class="success"></div>
    </div>

    <div id="sidebar" style="display:none;">
        <h3>Поиск</h3>
        <input type="text" id="search-input" placeholder="🔍 Поиск пользователей..." onkeyup="searchUsers()">
        <div id="search-results"></div>
        
        <h3>Мои контакты</h3>
        <div id="contacts"></div>
        
        <h3>Онлайн</h3>
        <div id="online-users"></div>
        
        <hr>
        <button onclick="addContact()">➕ Добавить контакт</button>
        <input type="text" id="contact-name" placeholder="Имя контакта">
    </div>

    <div id="chat" style="display:none;">
        <h3>Чат с <span id="chat-with"></span></h3>
        <div id="messages" style="height:200px; overflow-y:auto; border:1px solid #ccc; margin:10px; padding:10px;"></div>
        <input type="text" id="msg" placeholder="Сообщение">
        <button onclick="sendMsg()">Отправить</button>
        <button onclick="logout()">Выход</button>
        <button onclick="showSidebar()">Контакты</button>
    </div>
</div>

<script>
    var ws = null;
    var myName = '';
    var currentChat = '';
    var savedContacts = [];
    var onlineUsers = [];

    function showSidebar() {
        document.getElementById('sidebar').style.display = 'block';
    }

    function doRegister() {
        var u = document.getElementById('reg-username').value.trim();
        var p = document.getElementById('reg-password').value;
        var p2 = document.getElementById('reg-password2').value;
        
        if (u.length < 3 || u.length > 20) {
            document.getElementById('reg-error').textContent = 'Имя должно быть от 3 до 20 символов';
            return;
        }
        var validRegex = /^[a-zA-Z0-9_а-яА-ЯёЁ\s]+$/;
        if (!validRegex.test(u)) {
            document.getElementById('reg-error').textContent = 'Имя может содержать только буквы, цифры, пробелы и подчёркивание';
            return;
        }
        if (!u || !p) {
            document.getElementById('reg-error').textContent = 'Заполните поля';
            return;
        }
        if (p !== p2) {
            document.getElementById('reg-error').textContent = 'Пароли не совпадают';
            return;
        }
        if (p.length < 4) {
            document.getElementById('reg-error').textContent = 'Пароль минимум 4 символа';
            return;
        }
        document.getElementById('reg-error').textContent = '';
        document.getElementById('reg-success').textContent = 'Регистрация...';
        
        var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
        var temp = new WebSocket(url);
        
        temp.onopen = function() {
            temp.send(JSON.stringify({ type: 'register', from: u, password: p }));
        };
        
        temp.onmessage = function(e) {
            var m = JSON.parse(e.data);
            if (m.type === 'register_result') {
                if (m.success) {
                    document.getElementById('reg-success').textContent = 'Успех! Теперь войдите.';
                    setTimeout(function() { temp.close(); }, 1000);
                } else {
                    document.getElementById('reg-error').textContent = m.error;
                    document.getElementById('reg-success').textContent = '';
                }
            }
        };
    }

    function doLogin() {
        var u = document.getElementById('login-username').value.trim();
        var p = document.getElementById('login-password').value;
        if (!u || !p) {
            document.getElementById('login-error').textContent = 'Введите имя и пароль';
            return;
        }
        myName = u;
        var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
        ws = new WebSocket(url);
        
        ws.onopen = function() {
            ws.send(JSON.stringify({ type: 'login', from: u, password: p }));
        };
        
        ws.onmessage = function(e) {
            var m = JSON.parse(e.data);
            console.log("Ответ:", m);
            
            if (m.type === 'login_result') {
                if (m.success) {
                    document.getElementById('auth').style.display = 'none';
                    document.getElementById('sidebar').style.display = 'block';
                    document.getElementById('chat').style.display = 'block';
                    document.getElementById('login-error').textContent = '';
                } else {
                    document.getElementById('login-error').textContent = m.error || 'Ошибка входа';
                }
            } else if (m.type === 'contact_list') {
                savedContacts = m.text ? m.text.split(',') : [];
                updateContacts();
            } else if (m.type === 'user_list') {
                updateUsersList(m.text ? m.text.split(',') : []);
            } else if (m.type === 'online') {
                onlineUsers = m.text ? m.text.split(',') : [];
                updateOnlineUsers();
            } else if (m.type === 'search_results') {
                showSearchResults(m.text ? m.text.split(',') : []);
            } else if (m.type === 'add_contact_result') {
                if (m.success) {
                    alert(m.text);
                    ws.send(JSON.stringify({ type: 'get_users' }));
                } else {
                    alert(m.error);
                }
            }
        };
        
        ws.onerror = function() {
            document.getElementById('login-error').textContent = 'Ошибка подключения';
        };
    }

    function updateContacts() {
        var div = document.getElementById('contacts');
        if (!div) return;
        var html = '';
        savedContacts.forEach(c => {
            if (c !== myName) {
                html += '<div class="contact" onclick="selectChat(\'' + c + '\')">📱 ' + c + '</div>';
            }
        });
        if (!html) html = '<div>Нет контактов</div>';
        div.innerHTML = html;
    }

    function updateOnlineUsers() {
        var div = document.getElementById('online-users');
        if (!div) return;
        var html = '';
        onlineUsers.forEach(u => {
            if (u !== myName) {
                html += '<div class="contact" onclick="selectChat(\'' + u + '\')">🟢 ' + u + '</div>';
            }
        });
        if (!html) html = '<div>Никого нет в сети</div>';
        div.innerHTML = html;
    }

    function updateUsersList(users) {
        console.log("Все пользователи:", users);
    }

    function showSearchResults(users) {
        var div = document.getElementById('search-results');
        if (!users || users.length === 0) {
            div.innerHTML = '<div>👤 Не найдены</div>';
            return;
        }
        var html = '';
        users.forEach(u => {
            if (u !== myName) {
                html += '<div class="contact" onclick="addContactByName(\'' + u + '\')">👤 ' + u + ' ➕</div>';
            }
        });
        div.innerHTML = html || '<div>👤 Не найдены</div>';
    }

    function searchUsers() {
        var q = document.getElementById('search-input').value.trim();
        var div = document.getElementById('search-results');
        if (!q) {
            div.innerHTML = '';
            return;
        }
        div.innerHTML = '<div>Поиск...</div>';
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'search_users', text: q }));
        }
    }

    function addContact() {
        var name = document.getElementById('contact-name').value.trim();
        if (!name) {
            alert('Введите имя');
            return;
        }
        if (name === myName) {
            alert('Нельзя добавить себя');
            return;
        }
        ws.send(JSON.stringify({ type: 'add_contact', text: name }));
        document.getElementById('contact-name').value = '';
    }

    function addContactByName(name) {
        ws.send(JSON.stringify({ type: 'add_contact', text: name }));
        document.getElementById('search-results').innerHTML = '';
        document.getElementById('search-input').value = '';
    }

    function selectChat(name) {
        currentChat = name;
        document.getElementById('chat-with').textContent = name;
        document.getElementById('messages').innerHTML = '';
    }

    function sendMsg() {
        var text = document.getElementById('msg').value.trim();
        if (!text || !currentChat) {
            alert('Выберите чат и введите сообщение');
            return;
        }
        ws.send(JSON.stringify({ type: 'message', to: currentChat, text: text }));
        document.getElementById('msg').value = '';
        var div = document.getElementById('messages');
        div.innerHTML += '<div><b>Я:</b> ' + text + '</div>';
        div.scrollTop = div.scrollHeight;
    }

    function logout() {
        if (ws) ws.close();
        location.reload();
    }
</script>
</body>
</html>
